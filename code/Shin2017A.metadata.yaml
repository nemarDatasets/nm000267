methodology: Twenty-nine right-handed and one left-handed healthy subjects participated in motor imagery and mental arithmetic
  tasks. EEG data was recorded at 1000 Hz using 30 active electrodes with a BrainAmp amplifier, referenced to linked mastoids.
  NIRS data was collected at 12.5 Hz using NIRScout with 14 sources and 16 detectors resulting in 36 channels. Three sessions
  were conducted for each paradigm (MI and MA). Each session included 20 trials with 10s task periods and 15-17s rest periods.
  For MI, subjects performed kinesthetic hand gripping imagery at 1 Hz pace. Visual instructions included arrows for MI and
  arithmetic problems for MA. Motion artifacts from eye/head movements were also recorded. Signal processing included CSP
  for spatial filtering, log-variance features, and shrinkage LDA classifier with 10x5-fold cross-validation.
